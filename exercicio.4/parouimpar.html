<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Par ou Impar</title>
</head>
<body>

    <h1>Par ou Impar</h1>
    <script>
        let n = Number (prompt("Digite um numero: "))

        if (n % 2 === 0) {
            alert("Numero par")

        } else if(n % 2 === 1) {
            alert("Numero impar")
            
        } else {
            alert("Insira um valor válido")
        } 

    </script>
    
</body>
</html>
