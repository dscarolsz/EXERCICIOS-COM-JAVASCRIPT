<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Número Secreto</title>
</head>
<body>
    
    <script>
        let secreto = 7;
        let tentativas = 1;
        let chute = Number (prompt("Chute entre 1 a 10: "));

        while (chute !== secreto) {
            tentativas++;
            chute = Number (prompt("Errou! Tente novamente..."));
        }
        alert ("Acertou! Tentativas: " + tentativas)

    </script>

</body>
</html>
