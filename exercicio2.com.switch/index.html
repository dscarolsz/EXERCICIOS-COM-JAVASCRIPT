<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio - 2</title>
</head>
<body>
    
    <h1>Exercício - 2</h1>

    <script>
        let pedido = prompt (
            "CARDAPIO\n" +
            "1 - Hamburguer: R$ 15,00\n" +
            "2 - Pizza: R$ 20,00\n" +
            "3 - Suco: R$ 8,00\n\n" +
            "Digite um numero para um pedido:"
        );

        switch (pedido) {
            case "1":
                alert ("Você pediu um Hamburguer: R$ 15,00");
                break;
            case "1":
                alert ("Você pediu uma Pizza: R$ 20,00");
                break;
            case "1":
                alert ("Você pediu um Suco: R$ 8,00");
                break;
            default: 
                alert("Nenhum pedido realizado.");
        }
    </script>

</body>
</html>
