<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boletim</title>
</head>
<body>
    
    <h1>Boletim</h1>
    <script>
        let nota = Number (prompt("Insira a sua nota: "))
        
        if (nota >= 9.5 && nota <= 10) {
            alert ("Excelente!")

        } else if (nota >= 7) {
            alert ("Muito bom!")

        } else if (nota >= 5.5) {
            alert ("Quase lá!")

        } else if (nota >= 0) {
            alert ("Vamos estudar mais!")
            
        } else {
            alert ("Coloque uma nota.")
        }

    </script>

</body>
</html>
