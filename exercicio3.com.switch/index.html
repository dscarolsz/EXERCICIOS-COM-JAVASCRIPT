<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercico - 3</title>
  </head>
  <body>
    <h1>Exercicio - 3</h1>

    <script>
      let animal = prompt (
        "Animais:\n" +
          "cachorro\n" +
          "gato\n" +
          "vaca\n" +
          "galinha\n" +
          "pintinho\n" +
          "leão\n\n" +
          "Digite o nome de um Animal:"
      );

      switch (animal) {
        case "cachorro":
          alert ("Au Au!");
          break;
        case "gato":
          alert ("Miau!");
          break;
        case "vaca":
          alert ("Muuu!");
          break;
        case "galinha":
          alert ("Có Có!");
          break;
        case "pintinho":
          alert ("Có Có!");
          break;
        case "leão":
          alert ("Não conheço esse bicho");
          break;
        default:
            alert("Animal não encontrado!");
      }

    </script>
  </body>
</html>
