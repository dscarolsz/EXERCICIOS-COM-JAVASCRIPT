<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clube Secreto do KaiKai</title>
</head>
<body>
    
    <h1>Clube Secreto do KaiKai</h1>
    <script>
        const senha = "Dragao"
        const idade = 10

        let senha_usuario = (prompt("Insira a senha do Clube: "))
        let idade_usuario = Number (prompt("Insira sua idade: "))
        
        if (senha_usuario === senha && idade_usuario >= idade) {
            alert ("Bem vindo ao Clube!")

        } else if (senha_usuario !== senha) {
            alert ("Incorreto, fora!")

        } else if (idade_usuario < idade) {
            alert ("Ainda não...")

        } else {
            alert ("Insira um valor válido.")
        }

    </script>

</body>
</html>
