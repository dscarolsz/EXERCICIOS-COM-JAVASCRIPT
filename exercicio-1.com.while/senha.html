<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
</head>
<body>
    
    <script>
        let senha = prompt("Digite a sua senha: ")

        while (senha !== "abacaxi") {
            alert ("Senha incorreta.");
            senha = prompt ("Tente novamente!")
        }
        alert ("Acesso liberado!")

    </script>

</body>
</html>
